name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew || find . -name "gradlew" -exec chmod +x {} \;
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            find . -name "gradlew" -execdir ./gradlew assembleDebug \;
          fi
        # Verification: Checks that the Gradle build executes successfully.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '*.apk'
        # Verification: Confirms the APK file is successfully generated and uploaded.
